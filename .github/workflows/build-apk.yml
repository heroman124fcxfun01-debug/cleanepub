name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Cleanbook v2.0 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Sync offline ONNX voice models into Android assets (if present)
        run: |
          if [ -f "models/manifest.json" ] && [ ! -f "app/src/main/assets/models/manifest.json" ]; then
            echo "Copying root models/ into app/src/main/assets/models/..."
            mkdir -p app/src/main/assets/models
            cp -r models/* app/src/main/assets/models/
          elif [ -f "public/models/manifest.json" ] && [ ! -f "app/src/main/assets/models/manifest.json" ]; then
            echo "Copying public/models/ into app/src/main/assets/models/..."
            mkdir -p app/src/main/assets/models
            cp -r public/models/* app/src/main/assets/models/
          elif [ -f "app/src/main/assets/models/manifest.json" ]; then
            echo "Offline ONNX voice models already bundled in app/src/main/assets/models/."
          else
            echo "No models/manifest.json found — APK will run cleanly in safe device-TTS fallback mode."
          fi

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.EpubCleanPipelineUnitTest" --tests "com.example.ExampleUnitTest" --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK output
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/Cleanbook-v2.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cleanbook-v2.0-APK
          path: release-artifacts/Cleanbook-v2.0-debug.apk
          retention-days: 30

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/Cleanbook-v2.0-debug.apk
          generate_release_notes: true
