name: Build Full Offline APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Khôi phục debug.keystore từ debug.keystore.base64
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Đã giải mã debug.keystore thành công."
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Đã tạo debug.keystore dự phòng."
            fi
          fi

      - name: Cài đặt Node.js 20 để tải model
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tải trọn bộ model VieNeu (~380MB) vào app/src/main/assets/models
        run: |
          MODELS_DIR="app/src/main/assets/models"
          mkdir -p "$MODELS_DIR"

          MODELS_DIR="$MODELS_DIR" node -e '
            const fs = require("fs");
            const path = require("path");
            const MODELS_DIR = process.env.MODELS_DIR;
            const REPO = "duyquangnvx/vieneu-web-models";
            const BASE = `https://huggingface.co/${REPO}/resolve/main/`;

            async function fetchWithRetry(url, retries = 3) {
              for (let attempt = 1; attempt <= retries; attempt++) {
                try {
                  const res = await fetch(url, { redirect: "follow" });
                  if (res.ok) return res;
                  if (attempt === retries) throw new Error(`HTTP ${res.status} cho ${url}`);
                } catch (err) {
                  if (attempt === retries) throw err;
                }
                await new Promise(r => setTimeout(r, 2000 * attempt));
              }
            }

            (async () => {
              const apiRes = await fetchWithRetry(`https://huggingface.co/api/models/${REPO}`);
              const info = await apiRes.json();
              const files = (info.siblings || [])
                .map(s => s.rfilename)
                .filter(f => f && !f.startsWith(".") && f !== "README.md" && !f.endsWith(".gitattributes"));

              if (files.length === 0) {
                throw new Error("Không tìm thấy file model nào trên Hugging Face!");
              }

              const downloadedNames = [];
              for (const f of files) {
                const destPath = path.join(MODELS_DIR, f);
                fs.mkdirSync(path.dirname(destPath), { recursive: true });
                const encodedUrl = BASE + f.split("/").map(encodeURIComponent).join("/");
                console.log("Đang tải:", f, "->", destPath);
                const r = await fetchWithRetry(encodedUrl);
                const buf = Buffer.from(await r.arrayBuffer());
                if (buf.length < 256) {
                  const headText = buf.toString("utf8");
                  if (headText.includes("version https://git-lfs.github.com/spec/v1")) {
                    throw new Error(`File ${f} bị tải nhầm thành Git LFS pointer (${buf.length} bytes) thay vì dữ liệu nhị phân!`);
                  }
                }
                fs.writeFileSync(destPath, buf);
                downloadedNames.push(f);
                console.log("  Đã lưu:", f, `(${(buf.length / 1024 / 1024).toFixed(2)} MB)`);
              }

              const manifestPath = path.join(MODELS_DIR, "manifest.json");
              if (!fs.existsSync(manifestPath)) {
                const fallbackManifest = {
                  version: "vieneu-offline-1.0",
                  sampleRate: 24000,
                  files: downloadedNames
                };
                fs.writeFileSync(manifestPath, JSON.stringify(fallbackManifest, null, 2));
              }

              const listed = [];
              function walkCollect(dir) {
                let sum = 0;
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) sum += walkCollect(full);
                  else if (entry.isFile()) {
                    const sz = fs.statSync(full).size;
                    sum += sz;
                    listed.push(`${path.relative(MODELS_DIR, full)} (${(sz / 1024 / 1024).toFixed(2)} MB)`);
                  }
                }
                return sum;
              }
              const totalBytes = walkCollect(MODELS_DIR);
              console.log("=== DANH SÁCH FILE TRONG app/src/main/assets/models ===");
              for (const row of listed.sort()) console.log(" -", row);
              console.log("TỔNG DUNG LƯỢNG MODEL:", (totalBytes / 1024 / 1024).toFixed(2), "MB");
              if (!listed.some(x => x.includes(".onnx"))) {
                throw new Error("Không có file .onnx nào trong app/src/main/assets/models!");
              }
              if (totalBytes < 100 * 1024 * 1024) {
                throw new Error("Dung lượng model tải về quá nhỏ, có thể bị gián đoạn!");
              }
            })();
          '

      - name: Chạy kiểm thử tự động âm thanh AI (test_voice.wav)
        run: |
          mkdir -p /tmp/ort-test
          npm --prefix /tmp/ort-test install --no-audit --no-fund onnxruntime-node
          NODE_PATH=/tmp/ort-test/node_modules node scripts/test_tts.mjs \
            app/src/main/assets/models \
            test_voice.wav \
            tts_test_report.txt
          ls -lh test_voice.wav tts_test_report.txt

      - name: Lưu kết quả kiểm thử âm thanh (test_voice.wav & log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TTS-Audio-Test-${{ github.run_number }}
          path: |
            test_voice.wav
            tts_test_report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Cài đặt Java 21 (bắt buộc cho AGP 9.1 & Gradle 9.3)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Chấp nhận giấy phép Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Cài đặt Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Biên dịch file APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8"
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Không tìm thấy file APK sau khi biên dịch!"
            exit 1
          fi
          ls -lh "$APK_FILE"
          echo "=== KIỂM TRA FILE assets/models TRONG APK ==="
          unzip -l "$APK_FILE" | grep "assets/models/" || { echo "LỖI: APK không chứa assets/models/!"; exit 1; }
          echo "APK_PATH=$APK_FILE" >> "$GITHUB_ENV"

      - name: Lưu file APK vào GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cleanbook-Full-Offline-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: Xuất thẳng file APK và mẫu nghe thử test_voice.wav ra mục Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Cleanbook Full Offline v2.0.${{ github.run_number }}
          files: |
            ${{ env.APK_PATH }}
            test_voice.wav
            tts_test_report.txt
          fail_on_unmatched_files: true
