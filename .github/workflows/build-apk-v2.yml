name: Build Full Offline APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Khôi phục debug.keystore từ debug.keystore.base64
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Đã giải mã debug.keystore thành công."
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Đã tạo debug.keystore dự phòng."
            fi
          fi

      - name: Cài đặt Python 3.11 & eSpeak-NG tiếng Việt
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện Python (PyTorch CPU + NeuCodec + ONNX + llama-cpp-python)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1
          espeak-ng --version
          python3 -m pip install --upgrade pip -q
          python3 -m pip install --no-cache-dir -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --no-cache-dir -q --extra-index-url https://download.pytorch.org/whl/cpu neucodec onnx onnxscript
          python3 -m pip install --no-cache-dir -q huggingface_hub numpy onnxruntime soundfile
          python3 -m pip install --no-cache-dir -q --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python

      - name: Dọn rác, tải GGUF Turbo/Q4_0 nhẹ nhất & nén neucodec_decoder.onnx sang QUInt8
        run: |
          python3 scripts/download_vieneu_models.py app/src/main/assets/models
          ls -lh app/src/main/assets/models/

      - name: Xuất & kiểm thử neucodec_encoder.onnx (opset 17, float32[1,1,T] -> int32[1,1,N])
        run: |
          python3 scripts/export_neucodec_encoder.py \
            app/src/main/assets/models/neucodec_encoder.onnx \
            app/src/main/assets/models/neucodec_decoder.onnx
          echo "=== DANH SÁCH FILE THỰC TẾ TRONG app/src/main/assets/models/ ==="
          ls -lh app/src/main/assets/models/

      - name: Tạo từ điển âm vị tiếng Việt gọn nhẹ (vi_espeak_ipa.tsv) & kiểm tra dung lượng assets
        run: |
          python3 scripts/generate_vi_espeak_dict.py \
            app/src/main/assets/models/vi_espeak_ipa.tsv \
            app/src/main/assets/models/voices.json
          echo "=== DANH SÁCH FILE TRONG app/src/main/assets/ ==="
          find app/src/main/assets -maxdepth 3 -type f -exec ls -lh {} + | sort -k9
          echo "=== TỔNG DUNG LƯỢNG app/src/main/assets/models/ ==="
          du -sh app/src/main/assets/models/
          du -ch app/src/main/assets/models/*
          # Bắt buộc phải có đủ 4 thành phần chuẩn trong assets/models/
          ls app/src/main/assets/models/*.gguf >/dev/null 2>&1 || { echo "LỖI: Thiếu file *.gguf!"; exit 1; }
          test -f app/src/main/assets/models/neucodec_decoder.onnx || { echo "LỖI: Thiếu neucodec_decoder.onnx!"; exit 1; }
          test -f app/src/main/assets/models/neucodec_encoder.onnx || { echo "LỖI: Thiếu neucodec_encoder.onnx!"; exit 1; }
          test -f app/src/main/assets/models/voices.json || { echo "LỖI: Thiếu voices.json!"; exit 1; }
          test -f app/src/main/assets/models/vi_espeak_ipa.tsv || { echo "LỖI: Thiếu vi_espeak_ipa.tsv!"; exit 1; }
          # Chặn tuyệt đối các tệp rác/cũ không dùng tới
          for forbidden in "sea_g2p.bin" "VieNeuV3Turbo" "MOSS-Audio-Tokenizer-Nano"; do
            if find app/src/main/assets -iname "*${forbidden}*" | grep -q .; then
              echo "LỖI: Phát hiện tệp thừa/cũ '${forbidden}' trong app/src/main/assets!"
              exit 1
            fi
          done
          if find app/src/main/assets -type f \( -iname "*.wav" -o -iname "*.zip" -o -iname "*.md" \) | grep -q .; then
            echo "LỖI: Phát hiện tệp .wav/.zip/.md thừa trong app/src/main/assets!"
            exit 1
          fi

      - name: Chạy kiểm thử tự động VieNeu-TTS (GGUF + Decoder 24kHz + Encoder ONNX 16kHz)
        run: |
          python3 scripts/test_tts_gguf.py \
            app/src/main/assets/models \
            test_voice.wav \
            tts_test_report.txt
          ls -lh test_voice.wav tts_test_report.txt

      - name: Lưu kết quả kiểm thử âm thanh (test_voice.wav & log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TTS-Audio-Test-${{ github.run_number }}
          path: |
            test_voice.wav
            tts_test_report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Cài đặt Java 21 (bắt buộc cho AGP 9.1 & Gradle 9.3)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Chấp nhận giấy phép Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Cài đặt Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Biên dịch file APK tối ưu dung lượng (arm64-v8a only + R8 Shrink + Real ONNX Encoder)
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8"
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Không tìm thấy file APK sau khi biên dịch!"
            exit 1
          fi
          echo "=== DUNG LƯỢNG APK SAU TỐI ƯU ==="
          ls -lh "$APK_FILE"
          echo "=== KIỂM TRA FILE assets/models TRONG APK ==="
          unzip -l "$APK_FILE" | grep "assets/models/" || { echo "LỖI: APK không chứa assets/models/!"; exit 1; }
          unzip -l "$APK_FILE" | grep -q "\.gguf" || { echo "LỖI: APK thiếu model .gguf!"; exit 1; }
          unzip -l "$APK_FILE" | grep -q "neucodec_decoder\.onnx" || { echo "LỖI: APK thiếu neucodec_decoder.onnx!"; exit 1; }
          unzip -l "$APK_FILE" | grep -q "neucodec_encoder\.onnx" || { echo "LỖI: APK thiếu neucodec_encoder.onnx!"; exit 1; }
          unzip -l "$APK_FILE" | grep -q "voices\.json" || { echo "LỖI: APK thiếu voices.json!"; exit 1; }
          unzip -l "$APK_FILE" | grep -q "vi_espeak_ipa\.tsv" || { echo "LỖI: APK thiếu vi_espeak_ipa.tsv!"; exit 1; }
          echo "=== KIỂM TRA THƯ VIỆN NATIVE (.so) TRONG APK (CHỈ GIỮ arm64-v8a) ==="
          unzip -l "$APK_FILE" | grep "lib/" || true
          if unzip -l "$APK_FILE" | grep -E "lib/(armeabi|x86|x86_64|mips)/"; then
            echo "LỖI: APK vẫn còn thư viện native ngoài arm64-v8a!"
            exit 1
          fi
          echo "OK: APK tối ưu arm64-v8a + R8 + bộ đầy đủ GGUF + NeuCodec Decoder + NeuCodec Encoder ONNX."
          echo "APK_PATH=$APK_FILE" >> "$GITHUB_ENV"

      - name: Lưu file APK vào GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cleanbook-Full-Offline-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: Xuất thẳng file APK và mẫu nghe thử test_voice.wav ra mục Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Cleanbook Full Offline v2.0.${{ github.run_number }}
          files: |
            ${{ env.APK_PATH }}
            test_voice.wav
            tts_test_report.txt
          fail_on_unmatched_files: true
