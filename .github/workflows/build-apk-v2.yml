name: Build Full Offline APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tải trọn bộ model VieNeu (~380MB) và file WASM vào thư mục web của Android
        run: |
          INDEX_PATH=$(find . -maxdepth 6 -name "index.html" -not -path "*/build/*" -not -path "*/.git/*" | head -n 1)
          if [ -n "$INDEX_PATH" ]; then
            WEB_ROOT=$(dirname "$INDEX_PATH")
          elif [ -d "app/src/main/assets/public" ]; then
            WEB_ROOT="app/src/main/assets/public"
          elif [ -d "app/src/main/assets" ]; then
            WEB_ROOT="app/src/main/assets"
          else
            WEB_ROOT="public"
          fi
          echo "Thu muc web duoc chon: $WEB_ROOT"

          npm --prefix /tmp/ort install onnxruntime-web
          mkdir -p "$WEB_ROOT/ort" "$WEB_ROOT/models"
          cp -f /tmp/ort/node_modules/onnxruntime-web/dist/*.wasm "$WEB_ROOT/ort/" 2>/dev/null || true
          cp -f /tmp/ort/node_modules/onnxruntime-web/dist/*.mjs "$WEB_ROOT/ort/" 2>/dev/null || true

          WEB_ROOT="$WEB_ROOT" node -e '
            const fs = require("fs");
            const path = require("path");
            const WEB_ROOT = process.env.WEB_ROOT;
            const REPO = "duyquangnvx/vieneu-web-models";
            const BASE = `https://huggingface.co/${REPO}/resolve/main/`;
            (async () => {
              const apiRes = await fetch(`https://huggingface.co/api/models/${REPO}`);
              if (!apiRes.ok) throw new Error("Khong lay duoc danh sach file tu Hugging Face");
              const info = await apiRes.json();
              const files = (info.siblings || [])
                .map(s => s.rfilename)
                .filter(f => f && !f.startsWith(".") && f !== "README.md");
              for (const f of files) {
                console.log("Dang tai:", f);
                const r = await fetch(BASE + f);
                if (!r.ok) throw new Error("Loi tai file: " + f);
                const buf = Buffer.from(await r.arrayBuffer());
                const flatName = f.split("/").pop();
                fs.writeFileSync(path.join(WEB_ROOT, "models", flatName), buf);
                if (f.includes("/")) {
                  const nested = path.join(WEB_ROOT, "models", f);
                  fs.mkdirSync(path.dirname(nested), { recursive: true });
                  fs.writeFileSync(nested, buf);
                }
              }
              const totalBytes = fs.readdirSync(path.join(WEB_ROOT, "models")).reduce((s, f) => {
                const st = fs.statSync(path.join(WEB_ROOT, "models", f));
                return st.isFile() ? s + st.size : s;
              }, 0);
              console.log("TONG DUNG LUONG MODEL:", (totalBytes / 1024 / 1024).toFixed(1), "MB");
              if (totalBytes < 250 * 1024 * 1024) throw new Error("Chua du dung luong model!");
            })();
          '

      - name: Cấu hình không nén file model lớn và tăng RAM đóng gói
        run: |
          echo "" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties
          node -e '
            const fs = require("fs");
            for (const f of ["app/build.gradle", "app/build.gradle.kts"]) {
              if (!fs.existsSync(f)) continue;
              let txt = fs.readFileSync(f, "utf8");
              if (!txt.includes("onnx_data")) {
                if (f.endsWith(".kts")) {
                  txt = txt.replace(/android\s*\{/, "android {\n    androidResources {\n        noCompress += listOf(\"onnx\", \"bin\", \"wasm\", \"data\", \"onnx_data\")\n    }");
                } else {
                  txt = txt.replace(/android\s*\{/, "android {\n    aaptOptions {\n        noCompress \"onnx\", \"bin\", \"wasm\", \"data\", \"onnx_data\"\n    }");
                }
                fs.writeFileSync(f, txt);
              }
            }
          '

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Biên dịch file APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV

      - name: Xuất thẳng file APK ra mục Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ban-full-offline-${{ github.run_number }}
          files: ${{ env.APK_PATH }}
