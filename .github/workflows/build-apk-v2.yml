name: Build Full Offline APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài đặt thư viện và chép file WASM offline
        run: |
          npm install
          mkdir -p public/ort
          cp -f node_modules/onnxruntime-web/dist/*.wasm public/ort/ 2>/dev/null || true
          cp -f node_modules/onnxruntime-web/dist/*.mjs public/ort/ 2>/dev/null || true

      - name: Tự động tải trọn bộ model VieNeu (~380MB)
        run: |
          mkdir -p public/models
          node -e '
            const fs = require("fs");
            const path = require("path");
            const REPO = "duyquangnvx/vieneu-web-models";
            const BASE = `https://huggingface.co/${REPO}/resolve/main/`;
            (async () => {
              const apiRes = await fetch(`https://huggingface.co/api/models/${REPO}`);
              if (!apiRes.ok) throw new Error("Khong lay duoc danh sach file tu Hugging Face");
              const info = await apiRes.json();
              const files = (info.siblings || [])
                .map(s => s.rfilename)
                .filter(f => f && !f.startsWith(".") && f !== "README.md");
              for (const f of files) {
                console.log("Dang tai:", f);
                const r = await fetch(BASE + f);
                if (!r.ok) throw new Error("Loi tai file: " + f);
                const buf = Buffer.from(await r.arrayBuffer());
                const flatName = f.split("/").pop();
                fs.writeFileSync("public/models/" + flatName, buf);
                if (f.includes("/")) {
                  fs.mkdirSync(path.dirname("public/models/" + f), { recursive: true });
                  fs.writeFileSync("public/models/" + f, buf);
                }
              }
              const totalBytes = fs.readdirSync("public/models").reduce((s, f) => {
                const st = fs.statSync("public/models/" + f);
                return st.isFile() ? s + st.size : s;
              }, 0);
              console.log("TONG DUNG LUONG MODEL:", (totalBytes / 1024 / 1024).toFixed(1), "MB");
              if (totalBytes < 250 * 1024 * 1024) throw new Error("Chua du dung luong model!");
            })();
          '

      - name: Build giao diện Web
        run: npm run build

      - name: Đóng gói sang Android (Capacitor)
        run: |
          if [ -d "dist" ]; then WEB_DIR="dist"; else WEB_DIR="build"; fi
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "DocSachAI" "com.docsach.ai" --web-dir=$WEB_DIR
          fi
          rm -rf android
          npx cap add android

      - name: Cấp quyền Micro, tăng RAM đóng gói và giữ nguyên file model lớn
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android {|android {\n    aaptOptions { noCompress += ["onnx", "bin", "wasm", "data", "onnx_data"] }|' android/app/build.gradle
          mkdir -p android/app/src/main/java/com/docsach/ai
          rm -f android/app/src/main/java/com/docsach/ai/MainActivity.*
          cat << 'EOF' > android/app/src/main/java/com/docsach/ai/MainActivity.java
          package com.docsach.ai;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                  }
                  this.bridge.getWebView().setWebChromeClient(new BridgeWebChromeClient(this.bridge) {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });
              }
          }
          EOF

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Biên dịch file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Xuất thẳng file APK ra mục Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ban-full-offline-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
